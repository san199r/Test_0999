name: Run Lehigh Acres Permits Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager openpyxl

      - name: Run scraper
        env:
          HEADLESS: 'true'
          START_DATE: '04/21/2026'
          END_DATE: '04/25/2026'
          OUTPUT_FILE: 'LehighAcres_City_FL_Permits_DateRange_Output.xlsx'
        run: |
          python LehighAcres_City_FL_Permits_DateRange_Tool.py

      - name: Upload output artifact
        uses: actions/upload-artifact@v4
        with:
          name: permits-scraper-output
          path: LehighAcres_City_FL_Permits_DateRange_Output.xlsx
